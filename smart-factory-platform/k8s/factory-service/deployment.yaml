# Kubernetes API version used for Deployment resources.
# apps/v1 is the stable API version for Deployments.
apiVersion: apps/v1

# Resource type we are creating.
# Deployment manages the lifecycle and number of application Pods.
kind: Deployment

metadata:
  # Name of this Deployment inside Kubernetes.
  # We can use this name with commands like:
  # kubectl get deployment factory-service
  name: factory-service

spec:
  # Desired number of Pod replicas.
  # Kubernetes will continuously try to keep 2 Pods running.
  # If one Pod crashes, Deployment creates a replacement.
  replicas: 2

  selector:
    # Tells the Deployment which Pods it manages.
    # It looks for Pods having the label app=factory-service.
    matchLabels:
      app: factory-service

  template:
    # Configuration for the Pods created by this Deployment.
    metadata:
      labels:
        # Label assigned to every Pod created by this Deployment.
        # This must match selector.matchLabels above.
        # Kubernetes Services can also use this label to find these Pods.
        app: factory-service

    spec:
      containers:

        # Container configuration.
        - name: factory-service

          # Docker image used to create the container.
          # Kubernetes will start this image inside each Pod.
          image: smart-factory/factory-service:1.0.0

          ports:
            # Port on which the Spring Boot application listens
            # inside the container.
            #
            # Our application is configured to run on port 7070.
            #
            # Important:
            # containerPort does NOT expose the application outside
            # the Pod. A Kubernetes Service will do that later.
            - containerPort: 7070

          # Liveness probe answers:
          # "Is my application still alive?"
          #
          # If this repeatedly fails, Kubernetes can restart
          # the container.
          livenessProbe:
            httpGet:
              # Spring Boot Actuator liveness endpoint.
              path: /actuator/health/liveness

              # Port where Spring Boot is running.
              port: 7070

            # Wait 30 seconds after container startup before
            # performing the first liveness check.
            #
            # This gives Spring Boot time to start.
            initialDelaySeconds: 30

            # Kubernetes checks liveness every 10 seconds
            # after the initial delay.
            periodSeconds: 10

          # Readiness probe answers:
          # "Is my application ready to receive traffic?"
          #
          # If this fails, Kubernetes removes the Pod from
          # Service traffic, but does not necessarily restart it.
          readinessProbe:
            httpGet:
              # Spring Boot Actuator readiness endpoint.
              path: /actuator/health/readiness

              # Port where Spring Boot is running.
              port: 7070

            # Wait 30 seconds before the first readiness check.
            initialDelaySeconds: 30

            # Check readiness every 10 seconds.
            periodSeconds: 10