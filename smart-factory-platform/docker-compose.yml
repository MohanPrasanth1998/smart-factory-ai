name: smart-factory-platform
services:
  jwt-key-init:
    image: alpine:3.22
    command: ["sh", "-c", "apk add --no-cache openssl >/dev/null && if [ ! -s /keys/jwt-private.pem ] || [ ! -s /keys/jwt-public.pem ]; then openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/jwt-private.pem && openssl pkey -in /keys/jwt-private.pem -pubout -out /keys/jwt-public.pem && chmod 600 /keys/jwt-private.pem; fi"]
    volumes: ["jwt_keys:/keys"]
    restart: "no"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  postgres-telemetry:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_factory_telemetry
      POSTGRES_USER: smart_factory
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:-SmartFactory@2026}
    ports: ["15432:5432"]
    volumes: ["telemetry_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_factory -d smart_factory_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped
  auth-service:
    image: ${IMAGE_PREFIX:-smart-factory}/auth-service:${IMAGE_TAG:-local}
    build: ./services/auth/auth-service
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      SERVER_PORT: 7080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_auth
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    ports: ["7080:7080"]
    depends_on: {jwt-key-init: {condition: service_completed_successfully}, mysql: {condition: service_healthy}}
    restart: unless-stopped
    volumes: ["jwt_keys:/keys:ro"]
  factory-service:
    image: ${IMAGE_PREFIX:-smart-factory}/factory-service:${IMAGE_TAG:-local}
    build: ./services/factory
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      SERVER_PORT: 7070
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
    ports: ["7070:7070"]
    depends_on: {jwt-key-init: {condition: service_completed_successfully}, mysql: {condition: service_healthy}}
    restart: unless-stopped
    volumes: ["jwt_keys:/keys:ro"]
  machine-service:
    image: ${IMAGE_PREFIX:-smart-factory}/machine-service:${IMAGE_TAG:-local}
    build: ./services/machine/machine-service
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      SERVER_PORT: 7072
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_machine
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
      CLIENTS_FACTORY_URL: http://factory-service:7070
    ports: ["7072:7072"]
    depends_on: {jwt-key-init: {condition: service_completed_successfully}, mysql: {condition: service_healthy}, factory-service: {condition: service_started}}
    restart: unless-stopped
    volumes: ["jwt_keys:/keys:ro"]
  telemetry-service:
    image: ${IMAGE_PREFIX:-smart-factory}/telemetry-service:${IMAGE_TAG:-local}
    build: ./services/telemetry/telemetry-service
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      SERVER_PORT: 7073
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-telemetry:5432/smart_factory_telemetry
      SPRING_DATASOURCE_USERNAME: smart_factory
      SPRING_DATASOURCE_PASSWORD: ${TELEMETRY_DB_PASSWORD:-SmartFactory@2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CLIENTS_MACHINE_URL: http://machine-service:7072
    ports: ["7073:7073"]
    depends_on: {jwt-key-init: {condition: service_completed_successfully}, postgres-telemetry: {condition: service_healthy}, kafka: {condition: service_healthy}, redis: {condition: service_healthy}, machine-service: {condition: service_started}}
    restart: unless-stopped
    volumes: ["jwt_keys:/keys:ro"]
  device-simulator-service:
    image: ${IMAGE_PREFIX:-smart-factory}/device-simulator-service:${IMAGE_TAG:-local}
    build: ./services/device-simulator/device-simulator-service
    environment:
      SERVER_PORT: 7074
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["7074:7074"]
    depends_on: {kafka: {condition: service_healthy}}
    restart: unless-stopped
  maintenance-service:
    image: ${IMAGE_PREFIX:-smart-factory}/maintenance-service:${IMAGE_TAG:-local}
    build: ./services/maintenances
    environment:
      SERVER_PORT: 7075
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_maintenance
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports: ["7075:7075"]
    depends_on: {mysql: {condition: service_healthy}, kafka: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: unless-stopped
  production-service:
    image: ${IMAGE_PREFIX:-smart-factory}/production-service:${IMAGE_TAG:-local}
    build: ./services/production/production-service
    environment:
      SERVER_PORT: 7076
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_production
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports: ["7076:7076"]
    depends_on: {mysql: {condition: service_healthy}, kafka: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: unless-stopped
  analytics-service:
    image: ${IMAGE_PREFIX:-smart-factory}/analytics-service:${IMAGE_TAG:-local}
    build: ./services/analytics/analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_analytics
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports: ["7077:8080"]
    depends_on: {mysql: {condition: service_healthy}, kafka: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: unless-stopped
  notification-service:
    image: ${IMAGE_PREFIX:-smart-factory}/notification-service:${IMAGE_TAG:-local}
    build: ./services/notification/notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_notification
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SmartFactory@2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    ports: ["7078:8080"]
    depends_on: {mysql: {condition: service_healthy}, kafka: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: unless-stopped
  api-gateway:
    image: ${IMAGE_PREFIX:-smart-factory}/api-gateway:${IMAGE_TAG:-local}
    build: ./services/gateway/api-gateway
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
      AUTH_SERVICE_URL: http://auth-service:7080
      FACTORY_SERVICE_URL: http://factory-service:7070
    volumes: ["jwt_keys:/keys:ro"]
    ports: ["9090:9090"]
    depends_on: {jwt-key-init: {condition: service_completed_successfully}, auth-service: {condition: service_started}, factory-service: {condition: service_started}}
    restart: unless-stopped
volumes:
  jwt_keys:
  mysql_data:
  telemetry_db_data:
  redis_data:
  kafka_data:
