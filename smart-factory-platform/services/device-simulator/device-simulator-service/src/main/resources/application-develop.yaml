# Local developer profile. Override credentials through environment variables.
spring:
  application:
    name: device-simulator-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
server:
  port: 7074
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    root: INFO
app:
  kafka:
    ingest-topic: ${TELEMETRY_INGEST_TOPIC:factory.telemetry.ingest.v1}
