spring:
  application:
    name: ai-service

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2}

server:
  port: ${SERVER_PORT:6060}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: never


logging:
  level:
    org.springframework.ai: DEBUG