spring:
  application:
    name: telemetry-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_factory_telemetry}
    username: ${TELEMETRY_DB_USERNAME:postgres}
    password: ${TELEMETRY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/jwt-public.pem
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: telemetry-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
server:
  port: ${SERVER_PORT:7073}
clients:
  machine:
    url: ${CLIENTS_MACHINE_URL:http://localhost:7072}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.smartfactory.telemetry.client: DEBUG
    org.springframework.security: INFO
app:
  kafka:
    ingest-topic: ${TELEMETRY_INGEST_TOPIC:factory.telemetry.ingest.v1}
    telemetry-topic: ${TELEMETRY_TOPIC:factory.telemetry.v1}

