# QA profile. Supply all database credentials through environment variables/secrets.
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://auth-service:7080}
            predicates:
            - Path=/api/v1/auth/**
          - id: user-service
            uri: ${AUTH_SERVICE_URL:http://auth-service:7080}
            predicates:
            - Path=/api/v1/users/**
          - id: factory-service
            uri: ${FACTORY_SERVICE_URL:http://factory-service:7070}
            predicates:
            - Path=/api/v1/factories/**
server:
  port: 9090
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
