spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_factory_auth}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/jwt-public.pem

server:
  port: ${SERVER_PORT:7080}

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  level:
    org.springframework.security: DEBUG


jwt:
  private-key: ${JWT_PRIVATE_KEY_PATH:${user.home}/.smart-factory/keys/jwt-private.pem}
  public-key: ${JWT_PUBLIC_KEY_PATH:${user.home}/.smart-factory/keys/jwt-public.pem}
  expiration: 3600000