# QA profile override. Set MYSQL_ROOT_PASSWORD and TELEMETRY_DB_PASSWORD in .env or secret injection.
# Usage: docker compose -f docker-compose.yml -f docker-compose.qa.yml up --build -d
services:
  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: "qa"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/smart_factory_auth"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
  factory-service:
    environment:
      SPRING_PROFILES_ACTIVE: "qa"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/smart_factory"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
  machine-service:
    environment:
      SPRING_PROFILES_ACTIVE: "qa"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/smart_factory_machine"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      CLIENTS_FACTORY_URL: "http://factory-service:7070"
  telemetry-service:
    environment:
      SPRING_PROFILES_ACTIVE: "qa"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-telemetry:5432/smart_factory_telemetry"
      SPRING_DATASOURCE_USERNAME: "smart_factory"
      SPRING_DATASOURCE_PASSWORD: "${TELEMETRY_DB_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      CLIENTS_MACHINE_URL: "http://machine-service:7072"
  device-simulator-service:
