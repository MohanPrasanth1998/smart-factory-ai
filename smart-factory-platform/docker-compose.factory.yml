
services:
  factory-service:
    image: ${IMAGE_PREFIX:-smart-factory}/factory-service:${IMAGE_TAG:-local}
    build:
      context: ./services/factory
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "7070"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${FACTORY_DB_PASSWORD:?Set FACTORY_DB_PASSWORD in your shell}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/jwt-public.pem
    ports:
      - "7070:7070"
    networks:
      - smart-factory-existing
    volumes:
      - jwt_keys:/keys:ro

networks:
  smart-factory-existing:
    external: true
    name: smart-factory-platform_default

volumes:
  jwt_keys:
    external: true
    name: smart-factory-platform_jwt_keys
